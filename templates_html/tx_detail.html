{% extends "base.html" %}
{% block content %}
<h2>Transaction</h2>
<div class="card">
  <table class="kv-table">
    <tr><td>Hash</td><td class="hash">{{ tx_hash }}</td></tr>
    <tr><td>Status</td><td>{{ location }}</td></tr>
    <tr><td>From</td><td class="hash-short" style="word-break:break-all">{{ tx.from }}</td></tr>
    <tr><td>Nonce</td><td>{{ tx.nonce }}</td></tr>
    <tr><td>Fee</td><td>{{ tx.fee }}</td></tr>
  </table>
</div>
<div class="card">
  <div class="card-title">Outputs</div>
  <div class="table-wrap">
  <table>
    <thead><tr><th>To</th><th>Amount</th></tr></thead>
    <tbody>
    {% for o in tx.outputs %}
    <tr><td class="hash-short">{{ o.to }}</td><td>{{ o.amount }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
</div>
{% endblock %}
